name: Bumble Keepa Automation

on:
  # Manual run button bhi rahega
  workflow_dispatch:

  # Automatic daily run
  schedule:
    # 06:00 AM Dubai/Gulf = 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  keepa-pull:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Keepa pull
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python keepa_pull.py

      - name: Save Keepa data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepa_data/
          git diff --cached --quiet || git commit -m "Update Keepa data"
          git push
